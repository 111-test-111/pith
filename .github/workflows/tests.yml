name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run native adapters and the isolated performance benchmark
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:core -- --strict-skips
      - name: Required kernel sandbox enforcement (macOS)
        if: runner.os == 'macOS'
        run: npm test -- --suite sandbox --no-prepare --strict-skips --report-dir .test-results/sandbox
      - name: Host sandbox capabilities and fail-closed behavior (Linux)
        if: runner.os == 'Linux'
        run: npm test -- --suite sandbox --no-prepare --report-dir .test-results/sandbox
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-${{ matrix.os }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows build and test infrastructure
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Portable runner assertions (POSIX process fixtures report skips)
        run: npm test -- --suite test-runner --no-prepare
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-infrastructure
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ui:
    name: Electron UI (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Video fixture dependency
        run: brew install ffmpeg
      - run: npm ci
      - run: npm run test:ui -- --strict-skips
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: electron-ui-macos
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  extended:
    name: Native adapters and performance (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.extended
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:native -- --report-dir .test-results/native
      - name: Isolated performance workload
        if: ${{ !cancelled() }}
        run: npm run test:performance -- --no-prepare --report-dir .test-results/performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-and-performance
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
